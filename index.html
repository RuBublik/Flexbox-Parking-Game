<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Parking Lot Game</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div id="app">   
        <div id="sidebar">
            <section id="header">
                <h1 class="title">Flexbox Parking Lot Game</h1>
                <div id="level-indicator"></div>
            </section>
            
            <main>
                <section id="instructions">הוראות</section>

                <section id="editor-area">
                    <div class="code-editor">
                        <textarea id="css-input" placeholder="רשום כאן את קוד ה-CSS..." rows="4"></textarea>
                    </div>
                    
                    <button id="next-btn" disabled>השלב הבא ➔</button>
                </section>
            </main>

            <footer id="footer">
                <div>
                    <span id="credits-label">
                        See our
                        <a id="credits-github-link" href="https://github.com/RuBublik/Flexbox-Parking-Game" target="_blank" rel="noopener noreferrer">
                            GitHub
                        </a>
                    </span>
                </div>
            </footer>
        </div>

        <!-- לוח המשחק -->
        <div id="board">
            <div id="pads-layer"></div>
            <div id="cars-layer"></div>
        </div>

    </div>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
