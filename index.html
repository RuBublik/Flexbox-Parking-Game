<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Parking Lot Game</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div id="app">   
        <div id="sidebar">
            <section id="header">
                <h1 class="title">Flexbox Parking Lot Game</h1>
                <div id="level-indicator"></div>
            </section>
            
            <main>
                <section id="instructions">Instructions</section>

                <section id="editor-area">
                    <div class="code-editor">
                        <pre id="css-input-before">#cars-layer {</pre>
                        <textarea id="css-input-user-code" rows="5" placeholder="Add your CSS here..."></textarea>
                        <pre id="css-input-after">}</pre>
                    </div>

                    <div class="editor-actions">
                        <button id="hint-btn" class="game-btn">Hint</button>
                        <button id="check-btn" class="game-btn">Check</button>
                    </div>

                    <button id="next-btn" class="game-btn next-btn" disabled>Next Level</button>
                </section>
            </main>

            <footer id="footer">
                <div>
                    <span id="credits-label">
                        See our
                        <a id="credits-github-link" href="https://github.com/RuBublik/Flexbox-Parking-Game" target="_blank" rel="noopener noreferrer">
                            GitHub
                        </a>
                    </span>
                </div>
            </footer>
        </div>

        <div id="board">
            <div id="pads-layer"></div>
            <div id="cars-layer"></div>
        </div>

    </div>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
