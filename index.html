<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Parking Lot Game</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <style id="game-styles"></style>
  </head>
  <body>
    <div id="app">   
        <div id="sidebar">
            <section id="header">
                <h1 class="title">Flexbox Parking Lot Game</h1>
                <section id="level-indicator">
                    <span id="level-indicator-numeric"></span>
                    <br>
                    <span id="level-indicator-name"></span>
                </section>
            </section>
            
            <main>
                <section id="instructions">Instruction:</section>

                <section id="editor-area">
                    <div class="code-editor">
                        <pre id="css-input-before">#cars-layer {</pre>
                        <textarea id="css-input-user-code" rows="5" placeholder="Add your CSS here..."></textarea>
                        <pre id="css-input-after">}</pre>
                    </div>

                    <div class="editor-actions">
                        <button id="hint-btn" class="game-btn">Hint</button>
                        <button id="check-btn" class="game-btn">Check</button>
                        <button id="reset-btn" class="game-btn">Reset</button>
                    </div>

                    <p id="check-feedback"></p>

                    <div class="nav-actions">
                        <button id="prev-btn" class="game-btn prev-btn">&larr; Prev. Level</button>
                        <button id="next-btn" class="game-btn next-btn">Next Level &rarr;</button>
                    </div>
                </section>

                <section id="score-area">
                    <div id="score-label">Score:</div>
                    <div id="score-number"></div>
                </section>
            </main>

            <footer id="footer">
                <div>
                    <span id="credits-label">
                        See our
                        <a id="credits-github-link" href="https://github.com/RuBublik/Flexbox-Parking-Game" target="_blank" rel="noopener noreferrer">
                            GitHub
                        </a>
                    </span>
                </div>
            </footer>
        </div>

        <div id="board-area">
            <div id="board">
                <div id="pads-layer"></div>
                <div id="cars-layer"></div>
            </div>
        </div>

    </div>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
